<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f9eff"/>
      <stop offset="100%" stop-color="#7b5ea7"/>
    </linearGradient>
  </defs>

  <!-- Octagon badge -->
  <polygon points="9,2 23,2 30,9 30,23 23,30 9,30 2,23 2,9" fill="url(#tg-bg)"/>

  <!-- Inner depth ring -->
  <polygon points="11,6 21,6 26,11 26,21 21,26 11,26 6,21 6,11"
           fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>

  <!-- GT monogram
       Fusion point 1: (12,10) — G top-right = T crossbar left
       Fusion point 2: (18,17) — G entry bar end = T stem passthrough -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- G: C-arc wrapping left side, entry bar meeting T stem -->
    <path d="M 12 10 C 5 10 5 22 12 22 L 12 17 L 18 17" stroke-width="2.3"/>
    <!-- T crossbar — left end is shared with G's top anchor -->
    <line x1="12" y1="10" x2="24" y2="10" stroke-width="2.3"/>
    <!-- T stem -->
    <line x1="18" y1="10" x2="18" y2="24" stroke-width="2.3"/>
  </g>

  <!-- Node dots — graph metaphor at key junctions -->
  <circle cx="12" cy="10" r="2" fill="white" opacity="0.95"/>
  <circle cx="18" cy="24" r="2" fill="white" opacity="0.95"/>
</svg>
